<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seedance Shot Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110f">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Shot tracker</h1>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
  <div id="stats" class="stats"></div>
  <nav class="actions">
    <button id="addScene" class="primary">Add scene</button>
    <button id="foldAll">Collapse all scenes</button>
    <select id="filter" aria-label="Filter shots">
      <option value="all">All shots</option>
      <option value="missing">Missing files only</option>
      <option value="planned">Planned</option>
      <option value="prompted">Prompted</option>
      <option value="generated">Generated</option>
      <option value="edited">Edited</option>
    </select>
    <input type="search" id="search" placeholder="Search scenes, shots, prompts..." aria-label="Search">
    <button id="exportCsv">Export CSV</button>
    <button id="exportTxt">Share disclosure</button>
    <button id="exportPdf">Print / save as PDF</button>
    <button id="backup">Backup</button>
    <label class="btn">Restore<input type="file" id="restore" accept=".json" hidden></label>
    <span id="saveState" class="save-state" role="status" aria-live="polite"></span>
  </nav>
</header>
<details class="meta" open>
  <summary>Project and disclosure details</summary>
  <div class="grid">
    <label>Film title<input data-meta="title"></label>
    <label>Creator<input data-meta="creator"></label>
    <label>Contest<input data-meta="contest"></label>
    <label>AI tools used<input data-meta="tool" placeholder="Seedance 2.0, CapCut"></label>
  </div>
  <label>Human contribution (script, editing, voice, music, etc.)<textarea data-meta="human" rows="3"></textarea></label>
</details>
<main id="scenes"></main>
<section id="printArea" aria-hidden="true"></section>
<script src="app.js"></script>
</body>
</html>
